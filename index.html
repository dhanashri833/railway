<html>
<head>
    <title>Indian Railway</title>
</head>

<body bgcolor="lightblue">

<h1 align="center">🚆 Indian Railway 🚆</h1>
<hr>

<h2 align="center">Ticket Booking</h2>

<form align="center">

    From:
    <input type="text" placeholder="Enter Station">
    <br><br>

    To:
    <input type="text" placeholder="Enter Station">
    <br><br>

    Journey Date:
    <input type="date">
    <br><br>

    Passenger:
    <input type="number" min="1">
    <br><br>

    Class:
    <select>
        <option>Sleeper</option>
        <option>AC 3 Tier</option>
        <option>AC 2 Tier</option>
    </select>
    <br><br>

    <input type="submit" value="Book Ticket">

</form>

<hr>

<h3 align="center">Have a Safe Journey! 🚆</h3>

</body>
</html>
